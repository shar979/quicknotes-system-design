<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Service</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>

</head>
<body>
    <header>
    <h1>QuickNotes Service</h1>
  </header>
  <main>
    <section class="actions">
      <button id="load-btn">Load Notes</button>
    </section>

    <section class="form-section">
      <h2>Create a New Note</h2>
      <form id="note-form">
        <div class="field">
          <label for="title-input">Title (Required, max 100 chars):</label>
          <input type="text" id="title-input" maxlength="100" required placeholder="Note title...">
        </div>
        <div class="field">
          <label for="body-input">Body (Optional):</label>
          <textarea id="body-input" placeholder="Write your note content here..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <section class="status-section">
      <p id="status" aria-live="polite"></p>
    </section>

    <section class="list-section">
      <h2>Notes Directory</h2>
      <ul id="notes-list"></ul>
      <!-- empty list -->
    </section>
  </main>
</body>
</html>
